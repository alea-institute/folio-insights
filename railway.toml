# Railway configuration for folio-insights — two-service split.
# See https://docs.railway.com/reference/config-as-code
#
# Split rationale per REQ-QUALITY-03:
#   - `web` tier is JVM-free (FastAPI + SvelteKit adapter-node build).
#   - `worker` tier ships jlink custom JRE + owlready2 + HermiT for OWL reasoning.
# Redis is a Railway plugin OR Dagger-provisioned sidecar (Plan 00-05 finalizes).

[services.web]

[services.web.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"

[services.web.deploy]
# Railway polls this path after the container boots. If it does not return
# HTTP 2xx within healthcheckTimeout, the deploy is rolled back.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[services.worker]

[services.worker.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[services.worker.deploy]
# Worker polls Redis via Arq — no HTTP surface, so no healthcheckPath.
# Intentional omission (not missing config). Phase 10 cutover wires the
# real Arq consumer; until then the worker runs the Phase 0 idle-loop stub
# in src/folio_insights/worker.py.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
