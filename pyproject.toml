[project]
name = "folio-insights"
version = "0.1.0"
description = "Extract structured advocacy knowledge from legal textbooks and map to FOLIO ontology"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "rdflib>=7.6.0",
    "lxml>=5.0",
    "sentence-transformers>=3.0.0",
    "instructor>=1.14.0",
    "click>=8.0.0",
    "aiosqlite>=0.20.0",
    "folio-python>=0.1.5",
    # Bridge-tier runtime deps. folio-insights imports folio-enrich's code via a
    # sys.path bridge (config.folio_enrich_path), so folio-enrich's own runtime deps
    # are NOT pulled transitively and must be declared here. Their silent absence
    # disables .docx ingestion (python-docx) and ALL FOLIO IRI matching
    # (rapidfuzz/marisa-trie back folio-python search → without them every tag
    # degrades to an un-IRI'd proposed_class). Surfaced by the books-UAT de-risk run.
    "python-docx>=1.1.0",
    "rapidfuzz>=3.9.0",
    "marisa-trie>=1.2.0",
    # spacy backs folio-enrich's FOLIOEntityRuler (app.services.entity_ruler.ruler),
    # the DETERMINISTIC FOLIO IRI matcher the tagger's entity_ruler path calls
    # through the bridge. Its absence silently degraded tagging to LLM/semantic
    # guessing → ~60% wrong-concept IRIs in book-UAT (docs/solutions/
    # sys-path-bridge-staleness.md). Uses spacy.blank("en") + EntityRuler — no
    # downloaded model needed.
    "spacy>=3.7.0",
    # Web tier (api/main.py) — FastAPI serving the SvelteKit static SPA + /api.
    # Previously installed ad-hoc in Dockerfile.web (never declared here), which
    # left local dev/CI unable to collect the 7 api/ test suites. Declared as core
    # runtime deps so the manifest matches shipped reality (Dockerfile.web L48-60).
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=3.3.0",
    "pyshacl>=0.31.0",
    "pyoxigraph==0.5.7",
    "oxrdflib",
    # owlready2 (JVM/OWL reasoner) lives in the `reasoning` optional extra, not
    # core deps (Phase 03.5): the JVM-free web tier (Dockerfile.web) never imports
    # it, and its sdist wheel build fails on Railway's builder. The worker installs
    # it explicitly (Dockerfile.worker / requirements.worker.lock); reasoning
    # consumers (CLI/tests) get it via `.[reasoning]` (folded into `.[dev]`).
    "cryptography>=46",  # A1: ed25519 reviewer did:key generation (Phase 1 spike); Phase 6 bumped >=41 -> >=46 for did:web verify (STACK 46.0.7)
    "base58>=2.1",  # A2: did:key z-encoding multibase (W3C did:key ed25519 spec)
    # ── Phase 6 DID substrate (§6.5) — locked stack per .planning/research/STACK.md ──
    # RISK-4: we DELIBERATELY REJECT `didkit`, `pydid`, `python-jose`, and
    # `fastapi-users` (see STACK.md L53-56, L279-283; DID-01 acceptance criterion).
    # didkit is stale/non-3.12; pydid leaks deprecated pycryptodome APIs; python-jose
    # is unmaintained; fastapi-users forces a password-first identity model that
    # defeats our DID-first design.
    "pynacl==1.6.2",     # libsodium ed25519 sign/verify hot path (~6× cryptography)
    "jcs==0.2.1",        # RFC 8785 JSON canonicalization — canonical_content_hash (DID-03/D-12)
    "atproto==0.0.65",   # did:plc resolver: IdResolver().did.resolve(did) (DID-01/D-08)
    "dag-cbor==0.3.3",   # DAG-CBOR decode of did:plc operation log for historical-key pinning
    "joserfc==1.6.4",    # JWS wrapping if attestations export as VCs (replaces python-jose)
    "authlib==1.7.0",    # OAuth `sub`-claim semantics for the DID binding contract (DID-05/SEC-06)
]

[project.optional-dependencies]
# OWL reasoning stack (HermiT via owlready2 — requires a JVM). Only the worker /
# CLI reasoning paths and their tests need this; the web tier deliberately omits it.
reasoning = [
    "owlready2==0.50",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.3",
    "pytest-benchmark>=5.1",
    "hypothesis>=6.100",
    "dagger-io>=0.14.0",
    # Dagger SDK 0.20.x requires an OTel gRPC exporter at runtime (otlp_proto_grpc
    # entry point) — not pulled transitively. Without this, dagger.Connection()
    # fails with: Requested component 'otlp_proto_grpc' not found in entry point.
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.0",
    "ruff>=0.6.0",
    # Reasoning stack so local dev/test keeps HermiT (reason/ + polysemy/fp_audit).
    "owlready2==0.50",
]

[project.scripts]
folio-insights = "folio_insights.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folio_insights"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
markers = [
    "integration: tests requiring folio-enrich on disk",
    "gate3: Gate 3 worker image size test (requires docker + built worker image)",
    "gate4: Gate 4 SSR cold-page latency test (requires hyperfine + running servers)",
    "gate5: Gate 5 bit-identical digest test (slow, requires docker + dagger)",
    "slow: Tests taking >30s (skipped from quick suite via -m 'not slow')",
    "polysemy_spike: Phase 1 polysemy-distinguo spike tests",
    "shards: Phase 2 v2.0 Shard envelope tests",
    "identity: Phase 6 DID substrate tests",
    "governance: Phase 7 governance substrate tests",
    "corpus: Phase 7 corpus-init genesis + CORPUS-05 tests",
    "rfc: Phase 7 RFC lifecycle linter tests (GOV-07, D-22)",
]
