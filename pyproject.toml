[project]
name = "folio-insights"
version = "0.1.0"
description = "Extract structured advocacy knowledge from legal textbooks and map to FOLIO ontology"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "rdflib>=7.6.0",
    "lxml>=5.0",
    "sentence-transformers>=3.0.0",
    "instructor>=1.14.0",
    "click>=8.0.0",
    "aiosqlite>=0.20.0",
    "folio-python>=0.1.5",
    "sse-starlette>=3.3.0",
    "pyshacl>=0.31.0",
    "pyoxigraph==0.5.7",
    "oxrdflib",
    # owlready2 (JVM/OWL reasoner) lives in the `reasoning` optional extra, not
    # core deps (Phase 03.5): the JVM-free web tier (Dockerfile.web) never imports
    # it, and its sdist wheel build fails on Railway's builder. The worker installs
    # it explicitly (Dockerfile.worker / requirements.worker.lock); reasoning
    # consumers (CLI/tests) get it via `.[reasoning]` (folded into `.[dev]`).
    "cryptography>=41",  # A1: ed25519 reviewer did:key generation (Phase 1 spike)
    "base58>=2.1",  # A2: did:key z-encoding multibase (W3C did:key ed25519 spec)
]

[project.optional-dependencies]
# OWL reasoning stack (HermiT via owlready2 — requires a JVM). Only the worker /
# CLI reasoning paths and their tests need this; the web tier deliberately omits it.
reasoning = [
    "owlready2==0.50",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.3",
    "pytest-benchmark>=5.1",
    "hypothesis>=6.100",
    "dagger-io>=0.14.0",
    # Dagger SDK 0.20.x requires an OTel gRPC exporter at runtime (otlp_proto_grpc
    # entry point) — not pulled transitively. Without this, dagger.Connection()
    # fails with: Requested component 'otlp_proto_grpc' not found in entry point.
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.0",
    "ruff>=0.6.0",
    # Reasoning stack so local dev/test keeps HermiT (reason/ + polysemy/fp_audit).
    "owlready2==0.50",
]

[project.scripts]
folio-insights = "folio_insights.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folio_insights"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
markers = [
    "integration: tests requiring folio-enrich on disk",
    "gate3: Gate 3 worker image size test (requires docker + built worker image)",
    "gate4: Gate 4 SSR cold-page latency test (requires hyperfine + running servers)",
    "gate5: Gate 5 bit-identical digest test (slow, requires docker + dagger)",
    "slow: Tests taking >30s (skipped from quick suite via -m 'not slow')",
    "polysemy_spike: Phase 1 polysemy-distinguo spike tests",
    "shards: Phase 2 v2.0 Shard envelope tests",
]
